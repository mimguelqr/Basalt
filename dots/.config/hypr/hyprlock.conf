background {
    color = rgba(0, 0, 0, 1.0)
}

input-field {
    monitor =
    size = 200, 40
    hide_input = false

    outline_thickness = 2
    dots_size = 0.15
    dots_spacing = 0.35
    outer_color = rgba(33, 33, 33, 1.0)
    inner_color = rgba(13, 13, 13, 1.0)
    font_color = rgba(200, 200, 200, 1.0)

    fade_on_empty = true
    fade_timeout = 0

    check_color = rgba(33, 33, 33, 1.0)
    
    fail_color = rgba(33, 33, 33, 1.0)
    fail_text =

    placeholder_text = 

    position = 0, 0
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 65
    font_family = "Prompt"

    position = 0, 300
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(200, 200, 200, 1.0)
    font_size = 17
    font_family = "Prompt"

    position = 0, 240
    halign = center
    valign = center
}
